<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة CSAT إلى نهاية الشهر</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      text-align: center;
    }
    .sub {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    label {
      font-weight: bold;
      margin-bottom: 6px;
    }
    input {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    .results {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .result-box {
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      padding: 16px;
    }
    .result-box h3 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #1d4ed8;
    }
    .big {
      font-size: 28px;
      font-weight: bold;
      margin-top: 6px;
    }
    .muted {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
    }
    .table-wrap {
      margin-top: 18px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #eff6ff;
      color: #1e40af;
    }
    .note {
      margin-top: 16px;
      padding: 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      color: #9a3412;
      line-height: 1.8;
    }
    @media (max-width: 700px) {
      .grid, .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>حاسبة CSAT إلى نهاية الشهر</h1>
      <div class="sub">

      <div class="grid">
        <div class="field full">
          <label for="agentName">اسم الموظف</label>
          <input id="agentName" type="text" placeholder="مثال: dodx">
        </div>

        <div class="field">
          <label for="oneStar">1 نجمة</label>
          <input id="oneStar" type="number" min="0" value="0">
        </div>

        <div class="field">
          <label for="twoStar">2 نجمة</label>
          <input id="twoStar" type="number" min="0" value="0">
        </div>

        <div class="field">
          <label for="threeStar">3 نجوم</label>
          <input id="threeStar" type="number" min="0" value="0">
        </div>

        <div class="field">
          <label for="fourStar">4 نجوم</label>
          <input id="fourStar" type="number" min="0" value="0">
        </div>

        <div class="field">
          <label for="fiveStar">5 نجوم</label>
          <input id="fiveStar" type="number" min="0" value="0">
        </div>

        <div class="field">
          <label for="targetPercent">الهدف المطلوب %</label>
          <input id="targetPercent" type="number" min="1" max="99" value="70">
        </div>

        <div class="field full">
          <label for="dailyExpectedDsat">كم DSAT ممكن تنأكل يوميًا</label>
          <input id="dailyExpectedDsat" type="number" min="0" step="0.1" value="0">
        </div>
      </div>

      <button onclick="calculatePlan()">احسب الخطة</button>

      <div class="results" id="results" style="display:none;">
        <div class="result-box">
          <h3>CSAT الحالي</h3>
          <div class="big" id="currentCsat">0%</div>
          <div class="muted" id="currentCounts"></div>
        </div>

        <div class="result-box">
          <h3>الأيام المتبقية لنهاية الشهر</h3>
          <div class="big" id="daysLeft">0</div>
          <div class="muted" id="dateInfo"></div>
        </div>

        <div class="result-box">
          <h3>إجمالي الـ CSAT المطلوب</h3>
          <div class="big" id="totalNeeded">0</div>
          <div class="muted">هذا العدد المطلوب من اليوم إلى نهاية الشهر</div>
        </div>

        <div class="result-box">
          <h3>المطلوب يوميًا</h3>
          <div class="big" id="dailyNeeded">0</div>
          <div class="muted">عدد التقييمات الإيجابية المطلوبة يوميًا</div>
        </div>
      </div>

      <div class="table-wrap" id="tableWrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>البيان</th>
              <th>القيمة</th>
            </tr>
          </thead>
          <tbody id="detailsBody"></tbody>
        </table>
      </div>

      <div class="note" id="noteBox" style="display:none;"></div>
    </div>
  </div>

  <script>
    function ceilSafe(value) {
      if (!isFinite(value)) return 0;
      return Math.max(0, Math.ceil(value));
    }

    function formatNumber(value) {
      if (Number.isInteger(value)) return value.toString();
      return value.toFixed(2);
    }

    function getLastDayOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth() + 1, 0);
    }

    function calculateRequiredPositive(csatCount, totalCount, targetRatio, extraDsat) {
      // (csatCount + x) / (totalCount + x + extraDsat) >= targetRatio
      const numerator = (targetRatio * (totalCount + extraDsat)) - csatCount;
      const denominator = 1 - targetRatio;
      return ceilSafe(numerator / denominator);
    }

    function calculatePlan() {
      const agentName = document.getElementById("agentName").value.trim() || "الموظف";
      const one = parseInt(document.getElementById("oneStar").value) || 0;
      const two = parseInt(document.getElementById("twoStar").value) || 0;
      const three = parseInt(document.getElementById("threeStar").value) || 0;
      const four = parseInt(document.getElementById("fourStar").value) || 0;
      const five = parseInt(document.getElementById("fiveStar").value) || 0;
      const targetPercent = parseFloat(document.getElementById("targetPercent").value) || 70;
      const dailyExpectedDsat = parseFloat(document.getElementById("dailyExpectedDsat").value) || 0;

      const today = new Date();
      const total = one + two + three + four + five;
      const csatCount = four + five;
      const dsatCount = one + two + three;

      if (total <= 0) {
        alert("أدخل التقييمات أولًا");
        return;
      }

      if (targetPercent <= 0 || targetPercent >= 100) {
        alert("الهدف لازم يكون بين 1 و 99");
        return;
      }

      const targetRatio = targetPercent / 100;
      const currentCsat = (csatCount / total) * 100;

      const lastDay = getLastDayOfMonth(today);
      const msPerDay = 1000 * 60 * 60 * 24;

      const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const startOfLast = new Date(lastDay.getFullYear(), lastDay.getMonth(), lastDay.getDate());

      // شامل اليوم
      let daysLeftInclusive = Math.floor((startOfLast - startOfToday) / msPerDay) + 1;
      if (daysLeftInclusive < 1) daysLeftInclusive = 1;

      const expectedTotalDsatUntilMonthEnd = dailyExpectedDsat * daysLeftInclusive;

      const totalPositiveNeeded = calculateRequiredPositive(
        csatCount,
        total,
        targetRatio,
        expectedTotalDsatUntilMonthEnd
      );

      const dailyPositiveNeededExact = totalPositiveNeeded / daysLeftInclusive;
      const dailyPositiveNeeded = Math.ceil(dailyPositiveNeededExact);

      const projectedFinalTotal = total + expectedTotalDsatUntilMonthEnd + totalPositiveNeeded;
      const projectedFinalCsatCount = csatCount + totalPositiveNeeded;
      const projectedFinalCsatPercent = projectedFinalTotal > 0
        ? ((projectedFinalCsatCount / projectedFinalTotal) * 100)
        : 0;

      document.getElementById("results").style.display = "grid";
      document.getElementById("tableWrap").style.display = "block";
      document.getElementById("noteBox").style.display = "block";

      document.getElementById("currentCsat").textContent = currentCsat.toFixed(2) + "%";
      document.getElementById("currentCounts").innerHTML =
        `CSAT الحالي: ${csatCount} من ${total}<br>DSAT الحالي: ${dsatCount} من ${total}`;

      document.getElementById("daysLeft").textContent = daysLeftInclusive;
      document.getElementById("dateInfo").innerHTML =
        `اليوم: ${startOfToday.toLocaleDateString('ar-EG')}<br>نهاية الشهر: ${lastDay.toLocaleDateString('ar-EG')}`;

      document.getElementById("totalNeeded").textContent = totalPositiveNeeded;
      document.getElementById("dailyNeeded").textContent = dailyPositiveNeeded;

      const details = [
        ["اسم الموظف", agentName],
        ["1 نجمة", one],
        ["2 نجمة", two],
        ["3 نجوم", three],
        ["4 نجوم", four],
        ["5 نجوم", five],
        ["إجمالي التقييمات الحالي", total],
        ["عدد CSAT الحالي", csatCount],
        ["عدد DSAT الحالي", dsatCount],
        ["الهدف المطلوب", targetPercent + "%"],
        ["الأيام المتبقية شامل اليوم", daysLeftInclusive],
        ["DSAT المتوقع يوميًا", formatNumber(dailyExpectedDsat)],
        ["إجمالي DSAT المتوقع لنهاية الشهر", formatNumber(expectedTotalDsatUntilMonthEnd)],
        ["إجمالي CSAT المطلوب", totalPositiveNeeded],
        ["المطلوب يوميًا بدقة", dailyPositiveNeededExact.toFixed(2)],
        ["المطلوب يوميًا فعليًا", dailyPositiveNeeded],
        ["النسبة المتوقعة عند الالتزام بالخطة", projectedFinalCsatPercent.toFixed(2) + "%"]
      ];

      const tbody = document.getElementById("detailsBody");
      tbody.innerHTML = details.map(row => `
        <tr>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
        </tr>
      `).join("");

      let note = `${agentName} يحتاج ${totalPositiveNeeded} تقييمًا إيجابيًا حتى نهاية الشهر للوصول إلى ${targetPercent}%، بمعدل ${dailyPositiveNeeded} يوميًا تقريبًا`;

      if (dailyExpectedDsat > 0) {
        note += ` مع افتراض ${formatNumber(dailyExpectedDsat)} DSAT يوميًا.`;
      } else {
        note += ` بدون DSAT إضافي متوقع.`;
      }

      document.getElementById("noteBox").textContent = note;
    }
  </script>
</body>
</html>
